<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>梗论坛 · 梗憋着会堵，说出来就通了。</title>
<!-- Tailwind CDN（无需构建，双击即可运行） -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // 本项目的视觉完全由下方内联 CSS 实现（2000 年代中文 BBS 风格），
  // Tailwind 仅按要求保留引入；如需使用工具类，可在此扩展主题。
  tailwind.config = {
    theme: {
      extend: {
        colors: { bbsbg: '#e8eef3', bbspanel: '#ffffff', bbsline: '#cdd9e5', bbslink: '#0033cc' },
      },
    },
  };
</script>
<style>
/* ============================================================
   梗论坛 · 视觉层
   风格：2000 年代中文 BBS（浅灰底 / 蓝色链接 / 宋体小字 / 表格线框 / 高密度信息流）
   说明：全部样式自包含，即使 Tailwind CDN 不可用也能正常显示
   ============================================================ */
:root{
  --bg:#e8eef3;
  --panel:#ffffff;
  --panel-alt:#f7fafd;
  --line:#cdd9e5;
  --line-strong:#a9bdd1;
  --hd-a:#f7fafd;   --hd-b:#dde8f2;
  --bar-a:#2f6fb5;  --bar-b:#17497f;
  --deep:#0f3d6e;
  --link:#0033cc;
  --link-hover:#ff6600;
  --txt:#333333;
  --muted:#7b8794;
  --notice:#ffffe1;
  --notice-line:#e3d99a;
  --danger:#c0392b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:SimSun,"宋体","Songti SC","STSong","Microsoft YaHei",system-ui,sans-serif;
  font-size:12px;
  line-height:1.6;
}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover);text-decoration:underline}
button,input,textarea,select{font-family:inherit;font-size:12px;color:var(--txt)}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-size:14px;font-weight:700}
p{margin:0}
table{border-collapse:collapse;border-spacing:0}
img{max-width:100%}
::-webkit-scrollbar{width:13px;height:13px}
::-webkit-scrollbar-track{background:#eef2f6}
::-webkit-scrollbar-thumb{background:#b9c8d8;border:3px solid #eef2f6}
::-webkit-scrollbar-thumb:hover{background:#93a8bd}

/* ---------- 通用布局 ---------- */
.wrap{width:100%;max-width:1280px;margin:0 auto;padding:0 10px}
.main{padding:10px 0 0}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
.clip-1{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar{width:1px;height:11px;background:var(--line-strong);display:inline-block}
.divider{height:1px;background:var(--line);margin:8px 0;border-top:1px solid #fff}
.sec-title{font-weight:700;color:var(--deep);display:flex;align-items:center;gap:5px}
.sec-title::before{content:"◆";color:#2b7cd3;font-size:9px}

/* ---------- 面板 / 卡片 ---------- */
.panel,.card{background:var(--panel);border:1px solid var(--line-strong);margin-bottom:10px}
.panel-hd{background:linear-gradient(var(--hd-a),var(--hd-b));border-bottom:1px solid var(--line);padding:4px 9px;font-weight:700;color:var(--deep);display:flex;align-items:center;gap:7px}
.panel-hd .more{margin-left:auto;font-weight:400;color:var(--muted)}
.panel-bd{padding:9px}
.panel-bd.tight{padding:0}
.card-pad{padding:9px}
.card-hover:hover{border-color:#4a76a8}

/* ---------- 顶部（吸顶） ---------- */
.hd-fixed{position:sticky;top:0;z-index:60}
.site-hd{background:linear-gradient(var(--bar-a),var(--bar-b));border-bottom:2px solid #0d3560}
.site-hd-in{width:100%;max-width:1280px;margin:0 auto;padding:0 10px;height:54px;display:flex;align-items:center;gap:8px}
.logo-mark{width:34px;height:34px;flex:none;display:grid;place-items:center;background:linear-gradient(#e4553f,#b8341f);color:#fff;
  font-family:黑体,SimHei,"Microsoft YaHei",sans-serif;font-size:19px;font-weight:700;border:1px solid #8f2413;border-radius:3px;
  text-shadow:1px 1px 1px rgba(0,0,0,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.logo-text{font-family:黑体,SimHei,"Microsoft YaHei",sans-serif;font-size:19px;font-weight:700;color:#fff;letter-spacing:1px;text-shadow:1px 1px 2px rgba(0,0,0,.5)}
.logo-text:hover{color:#ffe9a8;text-decoration:none}
.logo-sub{color:#c3d9f0;font-size:11px}
.hd-search{flex:1;display:flex;justify-content:center;gap:0;min-width:120px}
.hd-search input{border:1px solid #0d3560;border-right:0;background:#fff;padding:2px 6px;width:100%;max-width:230px;height:22px;line-height:18px}
.hd-search input:focus{outline:none;background:#fffff8}
.site-hd .u-name{color:#eaf3fd}
.site-hd .user-link:hover{background:rgba(255,255,255,.16)}
.site-hd .user-link:hover .u-name{color:#ffe9a8}
.site-hd .exp-track{border-color:#0d3560}
.site-hd .exp-num{color:#c3d9f0}

/* 状态栏：跑马灯 + 站点统计 + 访问计数器 */
.statusbar{background:#dbe6f2;border-bottom:1px solid var(--line-strong)}
.statusbar-in{width:100%;max-width:1280px;margin:0 auto;padding:2px 10px;display:flex;align-items:center;gap:10px;font-size:11px;color:#44586c}
.statusbar-in b{color:var(--danger)}
.marquee{flex:1;min-width:110px;overflow:hidden;white-space:nowrap;background:var(--notice);border:1px solid var(--notice-line);line-height:16px;color:#6b5a12}
.marquee-in{display:inline-block;padding-left:100%;animation:marq 30s linear infinite}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.marquee-in{animation:none;padding-left:6px}}
.counter{display:inline-flex;gap:1px;vertical-align:middle}
.counter i{font-style:normal;font-family:Verdana,Arial,sans-serif;font-size:11px;line-height:15px;background:#1b1b1b;color:#7CFC00;border:1px solid #000;padding:0 3px;min-width:9px;text-align:center}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:1px solid #8a9ba8;background:linear-gradient(#fefefe,#e4e9ee);
  color:#1a3b5c;padding:1px 11px;line-height:19px;border-radius:2px;white-space:nowrap;font-size:12px}
.btn:hover{background:linear-gradient(#fff,#dbe6f2);border-color:#4a76a8;color:var(--deep);text-decoration:none}
.btn-primary{background:linear-gradient(#4a8fd0,#245f9b);border-color:#1d4f83;color:#fff;font-weight:700;text-shadow:0 -1px 0 rgba(0,0,0,.25)}
.btn-primary:hover{background:linear-gradient(#5da0de,#2b6fae);border-color:#1d4f83;color:#fff}
.btn-sm{padding:0 8px;line-height:17px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--deep)}
.btn-ghost:hover{background:rgba(255,255,255,.6);border-color:#8a9ba8}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* ---------- 等级徽章（Lv1 灰 / Lv2 绿 / Lv3 蓝 / Lv4 紫 / Lv5 橙 / Lv6 金） ---------- */
.lv-badge{display:inline-block;font-size:11px;line-height:15px;padding:0 5px;border-radius:2px;color:#fff;font-weight:700;
  font-family:Verdana,Arial,sans-serif;border:1px solid rgba(0,0,0,.2);vertical-align:middle;white-space:nowrap}
.lv-1{background:#9aa4ad}
.lv-2{background:#2e9e5b}
.lv-3{background:#2b7cd3}
.lv-4{background:#8b5cf6}
.lv-5{background:#e07b18}
.lv-6{background:linear-gradient(#f7d34a,#d4a017);color:#4a3700;border-color:#c08f10}
.grad-text{color:var(--danger);font-weight:700}

/* ---------- 经验条 ---------- */
.exp-track{display:block;flex:1;height:12px;background:#dbe9f7;border:1px solid #8a9ba8;border-radius:2px;overflow:hidden;min-width:60px;box-shadow:inset 0 1px 2px rgba(0,0,0,.14)}
.exp-fill{display:block;height:100%;background:linear-gradient(#8fcbf7,#2b6fae);transition:width .4s ease}
.exp-widget{display:inline-flex;align-items:center;gap:6px;width:100%}
.exp-num{font-size:11px;color:var(--muted);font-family:Verdana,Arial,sans-serif;white-space:nowrap}

/* ---------- 头像（方形，早期论坛风格） ---------- */
.avatar{display:inline-grid;place-items:center;color:#fff;font-weight:700;flex:none;line-height:1;user-select:none;
  border:1px solid rgba(0,0,0,.3);border-radius:2px;font-family:"Microsoft YaHei",sans-serif;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}

/* ---------- 跳转广告位（右栏，2000 年代网页广告风格） ---------- */
.adbox{display:block;position:relative;margin-bottom:10px;padding:10px 8px 9px;text-align:center;cursor:pointer;
  background:linear-gradient(#fffbe0,#ffe37a 55%,#ffc93c);border:2px dashed #c0392b;
  box-shadow:inset 0 0 0 2px #fff;text-decoration:none;animation:adGlow 1.4s ease-in-out infinite alternate}
.adbox:hover{text-decoration:none;border-style:solid;background:linear-gradient(#fffef2,#ffe98f 55%,#ffbb1f)}
.ad-tag{position:absolute;top:2px;right:3px;font-size:10px;line-height:13px;padding:0 3px;color:#8a8a8a;background:#fff;border:1px solid #d6d6d6}
.ad-blink{font-family:黑体,SimHei,"Microsoft YaHei",sans-serif;font-size:16px;font-weight:700;color:#c0392b;
  letter-spacing:2px;text-shadow:1px 1px 0 #fff;animation:blink 1s steps(1,end) infinite}
.ad-marq{overflow:hidden;white-space:nowrap;margin:5px 0 0;font-size:11px;color:#8a4d05;background:#fff8d8;border:1px solid #e3d99a;line-height:17px}
.ad-marq-in{display:inline-block;padding-left:100%;animation:marq 12s linear infinite}
.ad-cta{display:inline-block;margin-top:7px;padding:2px 14px;background:linear-gradient(#e4553f,#b8341f);color:#fff;
  font-weight:700;border:1px solid #8f2413;border-radius:2px;text-shadow:0 -1px 0 rgba(0,0,0,.3);animation:adPulse .8s ease-in-out infinite alternate}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.18}}
@keyframes adPulse{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes adGlow{from{box-shadow:inset 0 0 0 2px #fff}to{box-shadow:inset 0 0 0 2px #fff,0 0 10px rgba(224,123,24,.55)}}
@media (prefers-reduced-motion:reduce){
  .ad-blink,.ad-cta,.adbox{animation:none}
  .ad-marq-in{animation:none;padding-left:6px}
}

/* ---------- 用户链：真用户 / NPC 可点，假用户完全不可点（铁律 3） ---------- */
.user-link{display:inline-flex;align-items:center;gap:5px;padding:0 3px;border-radius:2px}
.user-link:hover{background:#fff3d9}
.user-link:hover .u-name{color:var(--link-hover);text-decoration:underline}
.u-name{color:var(--link)}
.user-static{display:inline-flex;align-items:center;gap:5px;padding:0 3px}
.user-static .u-name{color:#666}
.user-fake,.user-fake *{pointer-events:none !important;cursor:default !important}
.user-fake:hover,.user-fake *:hover{background:transparent !important;color:inherit !important;text-decoration:none !important;
  box-shadow:none !important;filter:none !important;transform:none !important}
.user-fake .u-name{color:#666 !important;text-decoration:none !important}

/* ---------- 标签 / 徽记 ---------- */
.tag{display:inline-block;font-size:11px;line-height:15px;padding:0 5px;background:#eef4fa;border:1px solid var(--line);color:#3d6a94;border-radius:2px;vertical-align:middle}
.feat-badge{display:inline-block;background:linear-gradient(#f7d34a,#d4a017);color:#4a3700;font-weight:700;font-size:11px;line-height:14px;
  padding:0 4px;border:1px solid #c08f10;border-radius:2px;vertical-align:middle}
.need-lv{color:var(--danger);font-weight:700;white-space:nowrap}
.op-badge{background:var(--danger);color:#fff;font-size:10px;line-height:14px;padding:0 4px;border-radius:2px;vertical-align:middle}

/* ---------- 主题列表表格 ---------- */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;font-size:12px;background:#fff}
.tbl th{background:linear-gradient(var(--hd-a),var(--hd-b));border:1px solid var(--line);padding:3px 8px;text-align:left;font-weight:700;color:var(--deep);white-space:nowrap}
.tbl td{border:1px solid var(--line);padding:4px 8px;vertical-align:middle}
.tbl tbody tr:nth-child(even){background:var(--panel-alt)}
.tbl tbody tr:hover{background:#f0f7ff}
.tbl .c-status{width:36px;text-align:center}
.tbl .c-author{width:112px}
.tbl .c-stat{width:74px;text-align:center;color:#666;font-family:Verdana,Arial,sans-serif}
.tbl .c-last{width:112px;color:#666;white-space:nowrap}
.topic{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.topic-title{color:var(--link);cursor:pointer}
.topic-title:hover{color:var(--link-hover);text-decoration:underline}
.tbl tbody tr.is-locked{background:#eaeaea}
.tbl tbody tr.is-locked:hover{background:#e2e2e2}
.tbl tr.is-locked .topic-title{color:#6f6f6f;cursor:pointer}

/* 假用户发布的主题：展示性静态行，仅保留标题，无任何可点击交互 */
.tbl tbody tr.is-static,.tbl tbody tr.is-static:hover{background:transparent}
.is-static,.is-static *{pointer-events:none !important;cursor:default !important;user-select:none}
.static-title{color:#4a5560}
.static-lock{color:#9a8b6a;font-weight:400}
.mini-row.is-static,.mini-row.is-static:hover{cursor:default}
.mini-row.is-static:hover .mini-t{color:inherit;text-decoration:none}
.g-title{user-select:none;letter-spacing:.5px}
.g-block{color:#0e0e0e;font-weight:400}
.g-noise{color:#8a94a0;font-style:normal}

/* ---------- 楼层（主题详情） ---------- */
.floor{border:1px solid var(--line);background:#fff;margin:8px}
.floor-hd{display:flex;align-items:center;gap:7px;background:linear-gradient(var(--hd-a),var(--hd-b));border-bottom:1px solid var(--line);
  padding:3px 8px;color:var(--deep);font-size:12px}
.floor-no{margin-left:auto;color:var(--muted);font-family:Verdana,Arial,sans-serif;font-size:11px;white-space:nowrap}
.floor-bd{display:flex;gap:10px;padding:10px}
.floor-side{width:132px;flex:none;border-right:1px solid var(--line);padding-right:9px;font-size:11px;color:#55616d;line-height:1.8}
.floor-side .avatar{margin-bottom:5px}
.floor-side .lbl{color:#8b96a1}
.floor-main{flex:1;min-width:0;font-size:13px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.floor-ft{display:flex;align-items:center;gap:7px;border-top:1px dashed var(--line);padding:3px 8px;font-size:11px;color:var(--muted);flex-wrap:wrap}

/* ---------- 用户资料表 ---------- */
.info-tbl{width:100%;font-size:12px}
.info-tbl th{width:98px;text-align:right;padding:3px 8px 3px 0;font-weight:400;color:#7b8794;vertical-align:top;white-space:nowrap}
.info-tbl td{padding:3px 0;vertical-align:middle;word-break:break-word}
.info-tbl tr{border-bottom:1px dotted #e4eaf1}

/* ---------- Tab（版块导航） ---------- */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line-strong);padding:0 6px}
.tab{display:inline-block;padding:3px 15px;border:1px solid var(--line);border-bottom:2px solid transparent;background:linear-gradient(var(--hd-a),var(--hd-b));
  color:#245f9b;font-weight:700;border-radius:3px 3px 0 0;margin-bottom:-2px;cursor:pointer}
.tab:hover{color:var(--link-hover);text-decoration:none;background:linear-gradient(#fff,#eaf3fb)}
.tab.active{background:#fff;border-bottom-color:#fff;color:var(--deep)}
.sub-tabs{display:flex;gap:4px;flex-wrap:wrap}
.sub-tab{padding:1px 11px;border:1px solid #8a9ba8;background:linear-gradient(#fefefe,#e9eef4);color:#245f9b;border-radius:2px;cursor:pointer}
.sub-tab:hover{color:var(--link-hover);text-decoration:none}
.sub-tab.active{background:linear-gradient(#4a8fd0,#245f9b);border-color:#1d4f83;color:#fff;font-weight:700}

/* ---------- 面包屑 ---------- */
.crumbs{background:#f4f7fa;border:1px solid var(--line);padding:3px 8px;margin-bottom:10px;color:#5a6b7c;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- 表单 ---------- */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:700;color:var(--deep)}
.input{border:1px solid #7f9db9;background:#fff;padding:3px 6px;width:100%;line-height:18px;border-radius:0;color:var(--txt)}
.input:focus{outline:none;border-color:#3d7fc1;background:#fffff8;box-shadow:0 0 3px rgba(61,127,193,.5)}
.input[readonly]{background:#efefef;color:#666;cursor:not-allowed}
.input.filled{background:#f2f7fc;border-color:#2b7cd3;color:#1a3b5c;cursor:not-allowed}
textarea.input{line-height:1.75;padding:5px 6px;resize:vertical}
.hint{font-size:11px;color:var(--muted)}
.pill-wrap{margin-top:5px}
.pill{border:1px dashed #7f9db9;background:#f2f7fc;color:#245f9b;padding:0 10px;border-radius:10px;line-height:19px;align-self:flex-start}
.pill:hover{background:#e2eefa;border-style:solid;border-color:#3d7fc1}
.form-error{color:var(--danger);font-weight:700;min-height:17px}
.field-tbl{width:100%}
.field-tbl th{width:88px;text-align:right;padding:7px 8px 7px 0;font-weight:700;color:var(--deep);vertical-align:top;white-space:nowrap}
.field-tbl td{padding:7px 0}

/* ---------- 首页 Banner ---------- */
.banner{background:#fff;border:1px solid var(--line-strong);margin-bottom:10px}
.banner-hd{background:linear-gradient(var(--bar-a),var(--bar-b));color:#fff;padding:5px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner-title{font-family:黑体,SimHei,"Microsoft YaHei",sans-serif;font-size:18px;color:#fff;letter-spacing:1px;text-shadow:1px 1px 2px rgba(0,0,0,.45)}
.banner-slogan{color:#cfe2f5;font-size:11px}
.banner-bd{padding:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stat-num{font-family:Verdana,Arial,sans-serif;font-size:15px;font-weight:700;color:var(--danger)}
.stat-label{font-size:11px;color:var(--muted)}

/* ---------- 站内活动（小游戏挂载点） ---------- */
.game-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.game-grid.col1{grid-template-columns:minmax(0,1fr)}
.game-grid.col1 .game-body{min-height:56px}
.game-grid.col1 .game-ph{font-size:11px}
.game-card{border:1px solid var(--line);background:#fbfdff}
.game-card-hd{background:linear-gradient(var(--hd-a),var(--hd-b));border-bottom:1px solid var(--line);padding:3px 8px;font-weight:700;color:var(--deep);display:flex;align-items:center;gap:6px}
.game-body{min-height:86px;border-bottom:1px dashed var(--line);background:#fff;display:grid;place-items:center;padding:12px;text-align:center}
.game-ph{color:#98a2ad;font-family:Consolas,Monaco,"Courier New",monospace;font-size:11.5px;letter-spacing:.2px}
.game-ft{padding:6px 8px}

/* ---------- 推荐 / 热门小列表 ---------- */
/* ---------- 三栏门户骨架（左 180 / 中自适应 / 右 240） ---------- */
.portal{display:grid;gap:10px;grid-template-columns:180px minmax(0,1fr) 240px;align-items:start}
.portal-side{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.portal-center{display:flex;flex-direction:column;gap:10px;min-width:0}
.portal-side>*,.portal-center>*{margin:0}

/* 侧栏：版块导航 */
.navlist{display:flex;flex-direction:column}
.navlist a{display:flex;align-items:center;gap:5px;padding:4px 8px;border-bottom:1px dotted var(--line);color:#245f9b}
.navlist a:hover{background:#fff3d9;color:var(--link-hover);text-decoration:none}
.navlist a.active{background:#dbe9f7;font-weight:700;color:var(--deep);border-left:3px solid #2b7cd3;padding-left:5px}
.navlist a .cnt{margin-left:auto;color:var(--muted);font-family:Verdana,Arial,sans-serif}
.navlist a.active .cnt{color:#245f9b}

/* 侧栏：版块分类（主题标签云，可点入搜索） */
.tagcloud{display:flex;flex-wrap:wrap;gap:4px;padding:8px}
.tagcloud a{background:#eef4fa;border:1px solid var(--line);padding:0 6px;line-height:17px;color:#3d6a94}
.tagcloud a:hover{background:#dbe9f7;color:var(--link-hover);text-decoration:none}
.tagcloud a b{color:var(--danger);font-weight:400}

/* 侧栏：站点统计 */
.side-stat{width:100%;font-size:11.5px}
.side-stat td{padding:2px 0;border-bottom:1px dotted var(--line)}
.side-stat td:last-child{text-align:right;font-family:Verdana,Arial,sans-serif;color:#245f9b;font-weight:700}

/* 侧栏内的迷你统计条 */

/**
 * 回帖提醒种子：指向已有帖子里的具体楼层
 * · 仅供预置，不做动态生成
 * · 数组里是 SEED_REPLIES 的下标，每条都对应一条真实存在的回复，点击即可跳到该楼层
 * · 一律取「真用户 / NPC 发布」的回复：假用户的昵称不可点击，不该出现在提醒来源里
 * · 前三条的目标主题 Lv1 即可浏览；后三条分别需要 Lv2 / Lv3 / Lv6，
 *   用来演示「等级不足时，提醒里的标题与摘要同样打码」（铁律 2）
 */
function buildSeedNotices(replies) {
  var picks = [
  0,   // post_1 / c1（阿飞 · 主题 Lv1）
  90,   // post_10 / c4（看门大爷 · 主题 Lv1）
  117,   // post_14 / c4（林深 · 主题 Lv1）
  74,   // post_8 / c4（打工小张 · 主题 Lv2）
  111,   // post_13 / c4（墨白 · 主题 Lv3）
  52,   // post_5 / c5（看门大爷 · 主题 Lv4）
  ];
  var out = [];
  for (var i = 0; i < picks.length; i++) {
    var r = replies[picks[i]];
    if (!r) continue;
    out.push({
      id: "n_" + String(i + 1).padStart(3, "0"),
      postId: r.postId,
      replyId: r.id,
      fromUid: r.authorId,
      excerpt: r.content.slice(0, 54),
      at: r.createdAt,
      read: false
    });
  }
  return out.sort(function (a, b) { return parseTime(b.at) - parseTime(a.at); });
}

/** 构建全新种子状态 */
function buildSeedState() {
  var users = SEED_USERS.map(function (u) {
    var o = JSON.parse(JSON.stringify(u));
    o.isSeed = true;
    return o;
  });

  var posts = SEED_POSTS.map(function (p) {
    return {
      id: p.id,
      title: p.title,
      content: p.content,
      authorId: p.authorId,
      createdAt: p.createdAt,
      minLevel: p.minLevel,
      isFeatured: !!p.isFeatured,
      tags: (p.tags || []).slice(),
      likes: [],
      favorites: [],
      likeBase: p.likeBase || 0,     // 预置热度：显示用，本人点赞在 likes 里累加
      favBase: p.favBase || 0,
      views: 120 + (hashStr(p.id) % 880)
    };
  });

  var replies = SEED_REPLIES.map(function (r, i) {
    return {
      id: "r_" + String(i + 1).padStart(3, "0") + "_" + r[0],
      postId: r[0],
      authorId: r[1],
      content: r[2],
      createdAt: r[3],
      likes: [],
      likeBase: r[4] || 0
    };
  });

  return {
    v: STATE_VERSION,
    currentUserUid: null,
    users: users,
    posts: posts,
    replies: replies,
    announcements: SEED_ANNOUNCEMENTS.map(function (a) { return JSON.parse(JSON.stringify(a)); }),
    notices: buildSeedNotices(replies),   // 回帖提醒（预置种子，不做动态生成）
    bootAt: nowStr()
  };
}

// =====================================================================
// ===== 4. 状态与持久化（localStorage: forum_state） =====
// =====================================================================
var state = null;

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && parsed.users && parsed.posts) {
        if (parsed.v === STATE_VERSION) {
          state = parsed;
          if (!state.notices) state.notices = buildSeedNotices(state.replies);   // 旧存档兼容
          if (!state.announcements) state.announcements = buildSeedState().announcements;
          return;
        }
        // 存档版本落后（种子内容整体换过）：重建全站数据，只把「我」的账号和访问数搬过来
        var mine = parsed.users.filter(function (u) { return u.isMe; });
        state = buildSeedState();
        state.users = state.users.concat(mine);
        state.visits = parsed.visits || 0;
        if (mine.some(function (u) { return u.uid === parsed.currentUserUid; })) {
          state.currentUserUid = parsed.currentUserUid;
        }
        saveState();
        return;
      }
    }
  } catch (err) {
    console.warn("[论坛] 读取本地存档失败，将重建种子数据：", err);
  }
  state = buildSeedState();
  saveState();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.warn("[论坛] 写入本地存档失败：", err);
  }
}

function getUser(uid) {
  for (var i = 0; i < state.users.length; i++) if (state.users[i].uid === uid) return state.users[i];
  return null;
}

function getPost(pid) {
  for (var i = 0; i < state.posts.length; i++) if (state.posts[i].id === pid) return state.posts[i];
  return null;
}

/** 当前登录用户（未登录返回 null） */
function getMe() {
  if (!state || !state.currentUserUid) return null;
  var u = getUser(state.currentUserUid);
  return u && u.type === "real" ? u : null;
}

/** 当前登录用户的等级 */
function myLevel() {
  var me = getMe();
  return me ? levelOf(me.exp) : 0;
}

  el.className = "toast " + (type || "");
  el.textContent = msg;
  el.style.marginTop = (toastSeq++ % 2) * 2 + "px";
  root.appendChild(el);
  setTimeout(function () {
    el.style.transition = "opacity .3s ease, transform .3s ease";
    el.style.opacity = "0";
    el.style.transform = "translateY(-8px)";
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
  }, 2600);
}

/** 真用户 / NPC 的主页可点开；假用户永远不可点（铁律 3） */
function isFakeUser(u) { return !!u && u.type === "fake"; }
function canOpenProfile(u) { return !!u && u.type !== "fake"; }
/** 可登录：仅真用户，且必须存在 loginId 与密码（NPC / 假用户登录页不认） */
function canLogin(u) { return !!u && u.type === "real" && !!u.loginId && !!u.password; }

/** 注册：校验 ID / 密码 / 邀请码（错误提示不透露正确答案） */
function handleRegister() {
  var errBox = document.getElementById("reg-error");
  var idEl = document.getElementById("reg-id");
  var pwdEl = document.getElementById("reg-pwd");
  var invEl = document.getElementById("reg-invite");
  if (!idEl || !pwdEl || !invEl) return;

  var id = idEl.value.trim();
  var pwd = pwdEl.value;
  var invite = invEl.value.trim();
  errBox.textContent = "";

  // 邀请码为选填：留空或填错都按普通用户注册；填对则额外奖励等级
  var inviteOK = invite === INVITE_CODE;

  if (id !== "user_af" || pwd !== "000000") {
    // 有意为之：不提示是哪一项错了，也不透露正确答案
    errBox.textContent = "注册信息校验失败，请检查用户 ID 与密码后重试。";
    return;
  }

  // 该 ID 是否已经注册过：只认「通过注册流程建过的账号」（排除预置种子账号，
  // 例如预置的「阿飞」loginId 同样是 user_af，若一并算作已注册，就再也建不出「我」了）
  var registered = null;
  for (var i = 0; i < state.users.length; i++) {
    var u = state.users[i];
    if (!u.isSeed && u.loginId === id) { registered = u; break; }
  }
  if (registered) {
    // 自动登录：先切到首页（go() 内部会关闭弹窗），再弹提示
    state.currentUserUid = registered.uid;
    saveState();
    applyLoginDefaultSeq(registered);
    go("#/home/latest");
    showModal("提示信息",
      '<div style="display:flex;gap:10px;align-items:flex-start">' +
        '<span style="font-size:18px">ℹ️</span>' +
        "<div>" +
          "<div>该用户ID已经注册过，自动为您登录。</div>" +
          '<div class="hint" style="margin-top:5px">当前身份：' + esc(registered.nickname) + " " +
            lvBadgeHtml(levelOf(registered.exp)) + " · 已为你进入论坛首页</div>" +
        "</div>" +
      "</div>" +
      '<div class="row" style="justify-content:flex-end;margin-top:14px">' +
        '<button class="btn btn-primary" data-action="close-modal">确定</button>' +
      "</div>");
    return;
  }

  // 创建「我」：默认 Lv1 / 0 经验；持有效邀请码则直接给到 Lv4 的门槛经验
  // 说明：预置账号 user_af 是论坛第一位居民「阿飞」；注册产生的是独立的「我」，
  // 共用同一个登录 ID，登录时优先进入「我」的账号。
  var startExp = inviteOK ? INVITE_BONUS_EXP : 0;
  var me = {
    uid: "me_" + makeId("u"),
    loginId: "user_af",
    nickname: "我",
    type: "real",
    level: levelOf(startExp),
    exp: startExp,
    bio: inviteOK ? "靠邀请码进来的，起步就是 Lv.4。" : "刚加入论坛的新人，先到处看看。",
    password: "000000",
    createdAt: nowStr(),
    isMe: true,
    viaInvite: inviteOK
  };
  state.users.push(me);
  state.currentUserUid = me.uid;
  saveState();
  applyLoginDefaultSeq(me);      // 以 user_af 注册的新账号，初始界面进度同样标记为 3
  if (inviteOK) {
    toast("注册成功，邀请码已生效：直接解锁 Lv.4", "ok");
  } else {
    toast("注册成功，欢迎来到「" + FORUM_NAME + "」", "ok");
  }
  go("#/home/latest");
}

/** 通过 user_af 登录的初始界面：进度标记为 3 */
function applyLoginDefaultSeq(user) {
  if (user && user.loginId === LOGIN_DEFAULT_ID) seqSet(LOGIN_DEFAULT_SEQ);
}

/** 登录：只认真用户账号 */
function handleLogin() {
  var errBox = document.getElementById("login-error");
  var idEl = document.getElementById("login-id");
  var pwdEl = document.getElementById("login-pwd");
  if (!idEl || !pwdEl) return;
  var id = idEl.value.trim();
  var pwd = pwdEl.value;
  if (errBox) errBox.textContent = "";

  var found = null;
  for (var i = 0; i < state.users.length; i++) {
    var u = state.users[i];
    if (!canLogin(u)) continue;                       // NPC / 假用户 直接跳过
    if (u.loginId !== id || u.password !== pwd) continue;
    if (!found || u.isMe) found = u;                  // 「我」优先
  }
  if (!found) {
    if (errBox) errBox.textContent = "账号不存在或密码错误。";
    return;
  }
  state.currentUserUid = found.uid;
  saveState();
  applyLoginDefaultSeq(found);   // user_af 登录后，初始界面的进度标记为 3
  toast("欢迎回来，" + found.nickname, "ok");
  go("#/home/latest");
}

function handleLogout() {
  state.currentUserUid = null;
  saveState();
  toast("已退出登录", "warn");
  go("#/register");
}

/** 点赞数 = 预置基数 + 本人是否点过，两处口径统一走这两个函数 */
function likeCount(o) { return (o && o.likeBase ? o.likeBase : 0) + (o && o.likes ? o.likes.length : 0); }
function favCount(p) { return (p && p.favBase ? p.favBase : 0) + (p && p.favorites ? p.favorites.length : 0); }

/** 铁律 2：用户等级 >= 帖子可见等级才能看到正文 */
function isLocked(post, me) {
  if (!me) return true;
  return levelOf(me.exp) < post.minLevel;
}

/** 未解锁内容的打码字符池 */
var GARBLE_BLOCKS = "█▓▒░▚▞◼◾▩▨▣";
var GARBLE_NOISE = ["锟", "斤", "拷", "烫", "屯", "卍", "㊣", "¤", "§", "¶", "¦", "×", "÷",
                    "Ø", "Ð", "Þ", "¥", "¢", "�", "◙", "◘", "▤", "▥", "╬", "╳", "≈", "⌒", "░"];

/**
 * 打码标题：用黑色方块与乱码字符逐个替换原文
 * - 与原文等长，版式稳定；同一主题每次渲染结果一致（按 seed 生成，刷新不会乱跳）
 * - 不包含任何原文信息
 */
function garbleTitle(title, seed) {
  var s = String(title == null ? "" : title);
  if (!s) return "";
  var rnd = hashStr(String(seed == null ? s : seed));
  var out = "";
  for (var i = 0; i < s.length; i++) {
    rnd = (rnd * 1103515245 + 12345) >>> 0;          // 线性同余，保证稳定
    if (rnd % 10 < 6) {
      out += '<b class="g-block">' + GARBLE_BLOCKS.charAt(rnd % GARBLE_BLOCKS.length) + "</b>";
    } else {
      out += '<i class="g-noise">' + GARBLE_NOISE[rnd % GARBLE_NOISE.length] + "</i>";
    }
  }
  return '<span class="g-title">' + out + "</span>";
}

function repliesOf(postId) {
  return state.replies.filter(function (r) { return r.postId === postId; });
}

function emptyState(art, title, desc) {
  return '<div class="empty"><div class="empty-art">' + art + "</div>" +
    '<div style="font-weight:700;color:#5a6b7c">' + esc(title) + "</div>" +
    (desc ? '<div style="margin-top:3px">' + esc(desc) + "</div>" : "") +
  "</div>";
}

/** 主题列表的一行（锁定主题：整行灰化 + 锁图标 + 打码标题，铁律 2） */
/** 是否为假用户（过客）发布的主题：仅作展示，不可点击交互，铁律 3 */
function isFakeAuthored(post) {
  var a = post ? getUser(post.authorId) : null;
  return !!a && a.type === "fake";
}

/** 主题列表的一行
 *  假用户（过客）发布的主题 → 纯静态行，只保留标题，不可点击、无 hover（铁律 3）
 *  真用户 / NPC 的主题 → 正常行（锁定主题整行灰化 + 打码标题，铁律 2）
 */
/** 主题列表的一行
 *  外观与普通行一致（状态 / 标题 / 作者 / 回复·查看 / 最后发表）
 *  - 假用户（过客）的主题：整行不可点击交互，标题为纯文本；未解锁则打码（铁律 3）
 *  - 真用户 / NPC 主题：可点击；未解锁行灰化 + 打码 + 点击弹窗（铁律 2）
 */
function postRowHtml(post, me) {
  var author = getUser(post.authorId);
  var locked = isLocked(post, me);
  var inert = isFakeAuthored(post);
  var replyCount = repliesOf(post.id).length;

  // 主题列：标题（假用户为纯文本不可点；未解锁则用方块乱码替换）
  var titleHtml;
  if (locked) {
    titleHtml = '<span class="' + (inert ? "static-title" : "topic-title") + '">' +
      garbleTitle(post.title, post.id) + "</span>" +
      (inert ? '<span class="static-lock nowrap">（需 Lv.' + post.minLevel + " 解锁）</span>"
             : '<span class="need-lv">需 Lv.' + post.minLevel + " 解锁</span>");
  } else {
    var tags = (post.tags || []).slice(0, 2).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join(" ");
    titleHtml = inert
      ? '<span class="static-title">' + esc(post.title) + "</span>"
      : '<span class="topic-title" data-action="open-post" data-post="' + post.id + '">' + esc(post.title) + "</span>";
    if (tags) titleHtml += " " + tags;
  }

  var cells =
    '<td class="c-status">' + (post.isFeatured ? '<span class="feat-badge">精</span>' : "💬") + "</td>" +
    '<td><div class="topic">' + titleHtml + "</div></td>" +
    '<td class="c-author">' + userChipHtml(author, { size: 20, noLevel: true }) + "</td>" +
    '<td class="c-stat">' + replyCount + " / " + post.views + "</td>" +
    '<td class="c-last">' + timeAgo(post.createdAt) + "</td>";

  if (inert) return '<tr class="is-static' + (locked ? " is-locked" : "") + '">' + cells + "</tr>";
  if (locked) return '<tr class="is-locked" data-action="lock-tip" data-post="' + post.id + '" style="cursor:pointer">' + cells + "</tr>";
  return "<tr>" + cells + "</tr>";
}

function postListHtml(posts, me, emptyDesc, title) {
  var head = '<div class="panel-hd">' + (title || "主题列表") + "</div>";

/** 锁定态正文占位：用黑色方块与乱码铺出若干行（不含任何真实内容，防止从 DOM 中读取） */
function lockSkeletonHtml(lines) {
  var widths = [46, 42, 44, 34, 43, 28, 40];
  var out = "", i, j;
  for (i = 0; i < lines; i++) {
    var w = widths[i % widths.length], dummy = "";
    for (j = 0; j < w; j++) dummy += "x";
    out += '<div class="skel-line">' + garbleTitle(dummy, "skel_" + lines + "_" + i) + "</div>";
  }
  return out;
}

  render();

  var me = getMe();
  var p = getPost(pid);
  if (!p) return;
  var i = p.favorites.indexOf(me.uid);
  if (i >= 0) { p.favorites.splice(i, 1); toast("已取消收藏", "warn"); }
  else { p.favorites.push(me.uid); toast("已加入收藏", "ok"); }

}

function statsOf(user) {
  var posts = state.posts.filter(function (p) { return p.authorId === user.uid; });
  var replies = state.replies.filter(function (r) { return r.authorId === user.uid; });
  var likesGot = posts.reduce(function (n, p) { return n + likeCount(p); }, 0) +
                 replies.reduce(function (n, r) { return n + likeCount(r); }, 0);
  return { posts: posts.length, replies: replies.length, likesGot: likesGot };
}

/** 某条回复在其主题里的楼层号（1 楼是楼主，回复自 2 楼起） */
function floorOfReply(postId, replyId) {
  var rs = repliesOf(postId).slice().sort(function (a, b) { return parseTime(a.createdAt) - parseTime(b.createdAt); });
  for (var i = 0; i < rs.length; i++) if (rs[i].id === replyId) return i + 2;
  return null;
}

  if (!p) return true;

  return isLocked(p, getMe());
}

        ' 回复了主题 <span class="notice-topic">' + title + "</span>" +
      "</div>" +
      '<div class="notice-excerpt">' + excerpt + "</div>" +
      '<div class="notice-meta">' +
        (floor ? floor + " 楼" : "楼层未知") +
        '<span class="bar"></span>' + timeAgo(n.at) +
        (locked
          ? '<span class="bar"></span><span class="need-lv">需 Lv.' + (post ? post.minLevel : "?") + " 解锁</span>"
          : '<span class="bar"></span><span>点击查看该楼层 »</span>') +
      "</div>" +
    "</div>" +
    '<span class="notice-flag">' + (n.read ? "已读" : "未读") + "</span>" +
  "</div>";
}

/** 回帖提醒列表（替代原「好友 / 私信」板块） */
function renderNotices(me) {
  var list = (state.notices || []).slice().sort(function (a, b) { return parseTime(b.at) - parseTime(a.at); });
  if (!list.length) {
    return '<div class="panel"><div class="panel-bd">' +
      emptyState("🔔", "暂时没有回帖提醒", "有人回复主题或楼层时，会出现在这里") + "</div></div>";
  }
  var unread = noticeUnreadCount();
  return '<div class="panel">' +
    '<div class="panel-hd">🔔 回帖提醒<span class="more">共 ' + list.length + " 条" +
      (unread ? " · " + unread + " 条未读" : " · 已全部读完") + "</span></div>" +
    (unread ? '<div class="notice-ops">' +
      '<button class="btn btn-sm" data-action="read-all-notices">全部标记为已读</button>' +
      '<span class="hint">点击任意一条，可跳转到对应主题的楼层</span></div>' : "") +
    '<div class="panel-bd tight">' + list.map(noticeItemHtml).join("") + "</div>" +
  "</div>";
}

/** 点击提醒：标记已读，并跳到对应主题的对应楼层 */
function openNotice(id) {
  var list = state.notices || [];
  var n = null;
  for (var i = 0; i < list.length; i++) if (list[i].id === id) { n = list[i]; break; }
  if (!n) return;
  if (!n.read) { n.read = true; saveState(); }
  go("#/post/" + n.postId + "/" + n.replyId);
}

/** 全部标记为已读 */
function markAllNoticesRead() {
  var n = 0;
  (state.notices || []).forEach(function (x) { if (!x.read) { x.read = true; n++; } });
  if (!n) return;
  saveState();
  toast("已将 " + n + " 条提醒标记为已读", "ok");
  render();
}

/** 跳到指定楼层并短暂高亮（主题详情渲染完成后调用） */
function scrollToReplyFloor(replyId) {
  var el = document.querySelector('[data-floor-reply="' + replyId + '"]');
  if (!el) return;
  if (el.scrollIntoView) el.scrollIntoView({ block: "center" });
  el.className = el.className + " flash";
  setTimeout(function () {
    el.className = el.className.replace(/\s*flash/, "");
  }, 2600);
}


// =====================================================================
// ===== 14.0 进度数字 · 新标签页交接 · 关键词表 =====
// =====================================================================
/** sessionStorage 可能被浏览器策略禁用，统一做容错 */
function ss() {
  try { return window.sessionStorage; } catch (e) { return null; }
}

/** 读取本标签页的进度数字，默认 1 */
function seqGet() {
  var st = ss();
  var n = st ? parseInt(st.getItem(SEQ_KEY), 10) : NaN;
  return isFinite(n) && n > 0 ? n : 1;
}

/** 写入本标签页的进度数字 */
function seqSet(page) {
  var st = ss();
  if (!st) return;
  st.setItem(SEQ_KEY, String(page));
}

/** 命中记录（调试用） */
function kwLog() {
  var st = ss();
  if (!st) return [];
  try { return JSON.parse(st.getItem(KW_LOG_KEY) || "[]"); } catch (e) { return []; }
}

/**
 * 接收交接：window.open 创建新标签页时，浏览器会把当前标签页的 sessionStorage 复制一份过去，
 * 所以新页面在这里取到交接数据后即销毁该键，避免刷新页面时重复采用。
 */
function adoptHandoff() {
  var st = ss();
  if (!st) return null;
  var raw = st.getItem(HANDOFF_KEY);
  if (!raw) return null;
  st.removeItem(HANDOFF_KEY);
  var data = null;
  try { data = JSON.parse(raw); } catch (e) { return null; }
  if (!data || !data.page) return null;
  seqSet(data.page);
  if (data.kw) {   // 命中进度关键词：记入命中记录
    var log = kwLog();
    log.push({ kw: data.kw, page: data.page, at: nowStr() });
    st.setItem(KW_LOG_KEY, JSON.stringify(log));
  }
  return data;
}

/** 查询关键词表中的进度关键词 */
function findProgressKeyword(kw) {
  for (var i = 0; i < KEYWORD_TABLE.length; i++) {
    if (KEYWORD_TABLE[i].kw === kw) return KEYWORD_TABLE[i];
  }
  return null;
}

/** 页脚：进度标记，格式为「进度数字/10」，样式与页脚其它小字完全一致 */
function footerPageHtml() {
  return '<div class="ft-page">' + seqGet() + "/" + SEQ_MAX + "</div>";
}

// =====================================================================
// ===== 14. 搜索（标题 / 正文 / 作者昵称） =====
// =====================================================================
function renderSearch(q, me) {
  var kw = String(q || "").trim();
  if (!kw) {
    return '<div class="panel"><div class="panel-bd">' +
      emptyState("🔍", "请输入关键词开始搜索", "可以搜索主题标题、正文内容、标签或作者昵称") + "</div></div>";
  }
  var lower = kw.toLowerCase();
  var hits = state.posts.filter(function (p) {
    var author = getUser(p.authorId);
    return p.title.toLowerCase().indexOf(lower) >= 0 ||
           p.content.toLowerCase().indexOf(lower) >= 0 ||
           (p.tags && p.tags.join(" ").toLowerCase().indexOf(lower) >= 0) ||
           (author && author.nickname.toLowerCase().indexOf(lower) >= 0);
  });
  hits = sortByNewest(hits);
  var lockedCount = hits.filter(function (p) { return isLocked(p, me); }).length;

  if (!hits.length) {
    return '<div class="panel"><div class="panel-hd">🔍 搜索：' + esc(kw) + '</div><div class="panel-bd">' +
      emptyState("🔍", "没有找到相关内容", "换个关键词试试，或者回到首页看看最新主题") + "</div></div>";
  }

  // 进度数字（本标签页的进度标记）只体现在页脚，与结果条数无关
  var info = "共 " + hits.length + " 条" +
    (lockedCount ? "，其中 " + lockedCount + " 条因等级不足被隐藏" : "");
  return postListHtml(hits, me, "", "🔍 搜索「" + esc(kw) + "」的结果（" + info + "）");
}

// =====================================================================
// ===== 15. 经验发放 / 全站事件委托 =====
// =====================================================================
/** 发放经验：升级时全站弹出一次升级动画并刷新经验条 */
function addExp(amount, reason) {
  var me = getMe();
  if (!me) return false;
  var before = levelOf(me.exp);
  me.exp = Math.max(0, me.exp + amount);
  me.level = levelOf(me.exp);          // 用户对象同时保留 level 与 exp
  saveState();
  var after = me.level;

  if (after > before) {
    render();                          // 重新渲染，低等级时被锁定的帖子会立即解锁
    showLevelUp(after);
    return true;
  }
  refreshExpWidgets();
  toast("经验 +" + amount + (reason ? "（" + reason + "）" : ""), "ok");
  return false;
}

function refreshExpWidgets() {
  renderExpWidgets();
}

/** 搜索提交 */
/**
 * 搜索：在【新标签页】打开搜索结果页。
 * 约定：
 *   · 网址里只带关键词，不带进度数字；进度数字通过 sessionStorage 交接
 *   · 命中关键词表 → 新页面进度推进到指定数字；未命中 → 与本标签页相同，进度不变
 *   · 当前标签页的路由、内容与编号一律保持原样
 *   · window.open 必须由用户点击 / 回车同步触发（本函数只在提交事件里同步调用），
 *     不要放进 setTimeout / 页面加载回调，否则会被浏览器拦截
 */
function submitSearch() {
  var input = document.getElementById("nav-search");
  if (!input) return;
  var kw = (input.value || "").trim();
  if (!kw) { toast("请输入搜索关键词", "warn"); return; }
  // 未登录时不开新标签页（新页面也只会看到登录墙）——当前页同样不做任何跳转
  if (!getMe()) { toast("请先登录后再搜索", "warn"); return; }

  var current = seqGet();                       // 本标签页当前进度
  var hit = findProgressKeyword(kw);
  var page = hit ? hit.page : current;          // 命中则推进到指定数字；未命中则与当前相同

  // 写入一次性交接数据；window.open 时浏览器会把它复制到新标签页的 sessionStorage
  // （交接键名沿用 forum_handoff / forum_seq，键名本身不进 URL，无需改动）
  var st = ss();
  if (st) st.setItem(HANDOFF_KEY, JSON.stringify({ page: page, kw: hit ? hit.kw : null }));

  // 同步打开新标签页（保持同步调用，交给浏览器判断为受信任的用户手势）
  var url = location.href.split("#")[0] + "#/search/" + encodeURIComponent(kw);
  var win = null;
  try { win = window.open(url, "_blank"); } catch (e) { win = null; }

  // 交接完成：立即销毁交接键，本标签页恢复原样（编号、路由、搜索框内容都不动）
  if (st) st.removeItem(HANDOFF_KEY);

  if (!win) toast("新标签页被浏览器拦截，请允许本站弹出窗口", "warn");
}

/** 点击事件委托（统一处理所有 data-action） */
document.addEventListener("click", function (e) {
  var el = e.target && e.target.closest ? e.target.closest("[data-action]") : null;
  if (!el) return;
  var act = el.getAttribute("data-action");
  var uid = el.getAttribute("data-uid");
  var pid = el.getAttribute("data-post");

  // 弹窗遮罩：只有点到遮罩本身才关闭，点内容区不关闭
  if (act === "close-modal") {
    if (e.target !== el) return;
    closeModal();
    return;
  }
  e.preventDefault();

  switch (act) {
    case "goto":
      go(el.getAttribute("data-href"));
      break;
    case "open-post":
      go("#/post/" + pid);
      break;
    case "lock-tip": {
      var p = getPost(pid);
      if (p) showLockTip(p);
      break;
    }
    case "go-user":
      go("#/u/" + uid);
      break;
    case "open-notice":
      openNotice(el.getAttribute("data-notice"));
      break;
    case "read-all-notices":
      markAllNoticesRead();
      break;
    case "open-ann":
      openAnnouncement(el.getAttribute("data-ann"));
      break;
    case "toggle-like":
      toggleLike(pid);
      break;
    case "toggle-fav":
      toggleFav(pid);
      break;
    case "start-game":
      startGame(parseInt(el.getAttribute("data-game"), 10));
      break;
    case "fill-uid": {
      var idEl = document.getElementById("reg-id");
      // 用 class 而非内联色值：填充后换成正文字色（避免沿用深色主题的浅色字）
      if (idEl) { idEl.value = "user_af"; idEl.className = "input filled"; }
      // 选项用后即隐：直接摘除选项块，不重新渲染注册页（避免清空已输入的密码 / 邀请码）
      var picker = document.querySelector("[data-uid-picker]");
      if (picker && picker.parentNode) picker.parentNode.removeChild(picker);
      var pwd = document.getElementById("reg-pwd");
      if (pwd) pwd.focus();
      break;
    }
    case "do-search":
      submitSearch();
      break;
    case "logout":
      handleLogout();
      break;
  }
});

/** 表单提交委托 */
document.addEventListener("submit", function (e) {
  var form = e.target && e.target.closest ? e.target.closest("[data-form]") : null;
  if (!form) return;
  e.preventDefault();
  var kind = form.getAttribute("data-form");
  if (kind === "register") handleRegister();
  else if (kind === "login") handleLogin();
  else if (kind === "reply") {
    var box = document.getElementById("reply-input");
    submitReply(form.getAttribute("data-post"), box ? box.value : "");
  }
});

/** 键盘：搜索框回车触发搜索（其它输入框走各自的表单提交） */
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { closeModal(); return; }
  if (e.key !== "Enter") return;
  var t = e.target;
  if (t && t.hasAttribute && t.hasAttribute("data-search-input")) {
    e.preventDefault();
    submitSearch();
  }
});

// =====================================================================
// ===== 16. 路由与启动 =====
// =====================================================================
function getRoute() {
  var raw = (location.hash || "").replace(/^#/, "");
  var seg = raw.split("/").filter(Boolean).map(function (s) {
    try { return decodeURIComponent(s); } catch (err) { return s; }
  });
  var a = seg[0], b = seg[1], c = seg[2];
  if (a === "register") return { name: "register", seg: seg };
  if (a === "login") return { name: "login", seg: seg };
  if (a === "post") return { name: "post", arg: b, arg2: c, seg: seg };   // arg2 = 要跳转的楼层（回复 id）
  if (a === "u") return { name: "user", arg: b, seg: seg };
  if (a === "search") return { name: "search", arg: b || "", seg: seg };
  if (a === "games") return { name: "games", seg: seg };
  if (a === "home") {
    var tab = b || "latest";
    if (tab === "friends") tab = "notices";   // 兼容旧链接 #/home/friends → 回帖提醒
    return { name: "home", tab: tab, sub: c, seg: seg };
  }
  return { name: a ? "404" : "root", seg: seg };
}

/** 统一的跳转入口（会顺带关闭弹窗） */
function go(hash) {
  closeModal();
  if (location.hash === hash) { render(); return; }
  location.hash = hash;
}

var lastRouteKey = null;

function render() {
  if (!state) return;
  var me = getMe();
  var route = getRoute();

  // ---------- 铁律 1：未注册 / 未登录用户被登录墙拦截 ----------
  // 任何路由、任何帖子、任何用户主页都不可访问，只能停留在注册页 / 登录页
  if (!me) {
    if (route.name !== "register" && route.name !== "login") {
      if (location.hash !== "#/register") location.replace("#/register");
      return;
    }
    document.getElementById("app").innerHTML = (route.name === "login") ? renderLogin() : renderRegister();
    return;
  }
  // 已登录用户不需要再看到注册 / 登录页
  if (route.name === "register" || route.name === "login") {
    if (location.hash !== "#/home/latest") location.replace("#/home/latest");
    else render();
    return;
  }
  if (route.name === "root") {
    if (location.hash !== "#/home/latest") location.replace("#/home/latest");
    return;
  }

  // ---------- 已登录：渲染带导航的完整界面 ----------
  var body;
  if (route.name === "home") body = renderHome(route, me);
  else if (route.name === "post") body = portalHtml(renderPostPage(route.arg, me), me);
  else if (route.name === "user") body = portalHtml(renderUserPage(route.arg, me), me);
  else if (route.name === "search") body = portalHtml(renderSearch(route.arg, me), me);
  else if (route.name === "games") body = renderGamesPage(me);
  else body = portalHtml('<div class="panel"><div class="panel-bd">' +
    emptyState("🧭", "页面不存在", "检查一下地址，或者点击左上角回首页") + "</div></div>", me);

  document.getElementById("app").innerHTML = renderNav(me) + '<div class="wrap main">' + body + footerHtml() + "</div>";

  renderExpWidgets();

  var key = [route.name, route.arg || "", route.arg2 || "", route.tab || "", route.sub || ""].join("|");
  if (key !== lastRouteKey) { lastRouteKey = key; window.scrollTo(0, 0); }
  // 从回帖提醒跳进来：滚动到对应楼层并高亮（放在滚动复位之后）
  if (route.name === "post" && route.arg2) scrollToReplyFloor(route.arg2);
}

function boot() {
  loadState();
  var adopted = adoptHandoff();   // 若本页是 window.open 打开的新标签页，这里接收进度 / 命中关键词
  // 通过 user_af 登录的初始界面：进度标记为 3
  // 仅在本标签页还没有进度、且本次不是交接进来的新标签页时套用，避免覆盖搜索推进的进度
  var st0 = ss();
  if (!adopted && st0 && st0.getItem(SEQ_KEY) === null && getMe() && getMe().loginId === LOGIN_DEFAULT_ID) {
    seqSet(LOGIN_DEFAULT_SEQ);
  }
  state.visits = (state.visits || 0) + 1;   // 站点访问计数器
  saveState();
  window.addEventListener("hashchange", render);
  render();
  // 调试用：控制台执行 forum.reset() 可清空存档并回到注册页
  window.forum = {
    reset: function () { localStorage.removeItem(STORAGE_KEY); location.hash = ""; location.reload(); },
    getState: function () { return state; },
    addExp: addExp,
    startGame: startGame,
    seq: seqGet,                  // 本标签页进度数字
    keywordTable: function () { return KEYWORD_TABLE; },
    kwLog: kwLog,                 // 命中的进度关键词记录
    notices: function () { return state.notices || []; },
    announcements: function () { return state.announcements || []; }
  };
  window.startGame = startGame;   // 小游戏统一挂载点，供后续替换为真实玩法
  console.log("[" + FORUM_NAME + "] 启动完成。清空存档：forum.reset()");
}

boot();
</script>
